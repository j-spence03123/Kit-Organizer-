[package]
name = "kit-core"
description = "Classification, scanning and file-organisation engine for Kit Organizer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5"
rayon = "1.10"
blake3 = "1.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs4 = "0.13"
symphonia = { version = "0.5.4", default-features = false, features = ["wav", "aiff", "pcm", "mp3", "flac", "ogg", "vorbis", "adpcm"] }

[dev-dependencies]
tempfile = "3"
